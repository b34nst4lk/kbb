<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#1a1a2e"/>

  <!-- Knowledge nodes (connected dots representing a knowledge graph) -->
  <g fill="#2563eb" opacity="0.9">
    <circle cx="256" cy="106" r="18"/>
    <circle cx="376" cy="196" r="18"/>
    <circle cx="376" cy="316" r="18"/>
    <circle cx="256" cy="406" r="18"/>
    <circle cx="136" cy="316" r="18"/>
    <circle cx="136" cy="196" r="18"/>
  </g>

  <!-- Connections between nodes (knowledge graph edges) -->
  <g stroke="#2563eb" stroke-width="3" opacity="0.4">
    <line x1="256" y1="106" x2="376" y2="196"/>
    <line x1="376" y1="196" x2="376" y2="316"/>
    <line x1="376" y1="316" x2="256" y2="406"/>
    <line x1="256" y1="406" x2="136" y2="316"/>
    <line x1="136" y1="316" x2="136" y2="196"/>
    <line x1="136" y1="196" x2="256" y2="106"/>
    <line x1="256" y1="106" x2="256" y2="406"/>
    <line x1="136" y1="196" x2="376" y2="316"/>
    <line x1="376" y1="196" x2="136" y2="316"/>
  </g>

  <!-- Central question mark -->
  <text x="256" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="140" font-weight="bold" fill="#ffffff" opacity="0.95">?</text>

  <!-- Bright dots at node centers -->
  <g fill="#60a5fa" opacity="0.7">
    <circle cx="256" cy="106" r="6"/>
    <circle cx="376" cy="196" r="6"/>
    <circle cx="376" cy="316" r="6"/>
    <circle cx="256" cy="406" r="6"/>
    <circle cx="136" cy="316" r="6"/>
    <circle cx="136" cy="196" r="6"/>
  </g>

  <!-- Subtle glow -->
  <circle cx="256" cy="250" r="80" fill="url(#glow)" opacity="0.15"/>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>