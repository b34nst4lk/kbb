{% extends "base.html" %}
{% block title %}{{ entry.title }} — KBB{% endblock %}
{% block content %}
<h1>{{ entry.title }}</h1>

<div class="card">
    <span class="badge">{{ entry.topic.value }}</span>
    <span class="list-item-meta">{{ entry.source }} · {{ entry.created_at or "unknown date" }}</span>
</div>

<div class="card">
    <div class="markdown-content">{{ entry.content | markdown | safe }}</div>
</div>

<div class="form-actions">
    <a href="/knowledge" class="btn">Back to Knowledge</a>
</div>
{% endblock %}
