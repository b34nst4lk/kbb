<form hx-post="/partials/response"
      hx-target="#response-area"
      hx-swap="innerHTML"
      hx-indicator="#response-spinner">
    <input type="hidden" name="question_text" value="{{ question.text }}">
    <input type="hidden" name="question_topic" value="{{ question.topic.value }}">
    <input type="hidden" name="question_rationale" value="{{ question.rationale }}">
    <div class="form-group">
        <label for="response">Your Response</label>
        <textarea name="response" id="response" rows="10"
                  placeholder="Write your response here. Ctrl+Enter to submit."></textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Record Response</button>
        <span id="response-spinner" class="htmx-indicator">Recording your knowledge...</span>
    </div>
</form>
