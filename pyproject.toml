[project]
name = "knowledge-base-builder"
version = "0.2.0"
description = "Build a personal knowledge base through scheduled questions — CLI, web, or desktop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.50,<1.0",
    "openai>=1.0,<2.0",
    "ollama>=0.4,<1.0",
    "pydantic>=2.0,<3.0",
    "python-slugify>=8.0,<9.0",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.15,<1.0",
    "click>=8.0,<9.0",
    "rich>=13.0,<14.0",
]
web = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.18,<1.0",
    "pyyaml>=6.0,<7.0",
]
desktop = [
    "pywebview>=5.0,<6.0",
]
transcription = [
    "faster-whisper>=1.0,<2.0",
]
transcription-whisper = [
    "openai-whisper>=20231117",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.8,<1.0",
    "httpx>=0.28,<1.0",
    "knowledge-base-builder[web]",
]
all = [
    "knowledge-base-builder[cli,web,desktop,transcription]",
]

[project.scripts]
kbb = "kbb_cli.app:app"
kbb-desktop = "kbb_web.desktop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbb", "src/kbb_cli", "src/kbb_web"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
