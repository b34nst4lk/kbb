[project]
name = "knowledge-base-builder"
version = "0.1.0"
description = "CLI tool to build a personal knowledge base through scheduled questions"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15,<1.0",
    "click>=8.0,<9.0",
    "rich>=13.0,<14.0",
    "anthropic>=0.50,<1.0",
    "openai>=1.0,<2.0",
    "python-slugify>=8.0,<9.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.0,<2.0",
]

[project.scripts]
kbb = "kbb_cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbb", "src/kbb_cli"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]